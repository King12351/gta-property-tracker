<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTA Property Tracker</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body><header><div><h1>GTA PROPERTY TRACKER</h1><p>Los Santos ownership tracker</p></div><nav><button id="admin">Login to Edit</button><button id="logout" style="display:none">Logout</button><button id="labelMode" disabled>Add Map Label</button><button id="export">Export Backup</button><label class="importLabel">Import Backup <input id="import" type="file" accept=".json" disabled></label></nav></header>
<p id="connection">Connecting to cloud storage…</p>
<main><aside><input id="search" placeholder="Search properties or owners"><select id="status"><option value="all">All statuses</option><option value="owned">Owned</option><option value="available">Available</option><option value="pending">Pending</option></select><div id="list"></div><p>Status: <span class="owned">Owned</span> / <span class="available">Available</span> / <span class="pending">Pending</span></p></aside><section><div id="map"></div><p class="mapnote">Sign in to add custom markers and map labels. Changes sync for everyone.</p></section></main>
<dialog id="adminDialog"><form id="loginForm"><h2>Editor Login</h2><p>Login with your account. Use Sign Up to create an account first.</p><label>Email<input id="email" type="email" required></label><label>Password<input id="authPassword" type="password" minlength="6" required></label><button type="submit">Login</button><button type="button" id="signup">Sign Up</button><button type="button" onclick="document.getElementById('adminDialog').close()">Cancel</button></form></dialog>
<dialog id="propertyDialog"><form id="form"><h2>Property details</h2><input id="id" type="hidden"><label>Name / address<input id="name" required></label><label>Type<select id="type"><option>House</option><option>Apartment</option><option>Business</option><option>Story</option></select></label><label>Status<select id="statusSelect"><option value="available">Available</option><option value="owned">Owned</option><option value="pending">Pending</option></select></label><label>Owner<input id="owner"></label><label>Price<input id="price"></label><label>Notes<textarea id="notes"></textarea></label><div class="buttons"><button type="button" id="delete">Delete</button><button type="button" id="cancel">Cancel</button><button type="submit">Save</button></div></form></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
