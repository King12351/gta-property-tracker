<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTA Property Tracker</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body>
<header><div><h1>GTA PROPERTY TRACKER</h1><p>Los Santos ownership tracker</p></div><div><button id="admin">Admin: OFF</button><button id="export">Export Backup</button><label>Import Backup <input id="import" type="file" accept=".json"></label></div></header>
<main><aside><input id="search" placeholder="Search properties or owners"><select id="status"><option value="all">All statuses</option><option value="owned">Owned</option><option value="available">Available</option><option value="pending">Pending</option></select><div id="list"></div><p>Status: <span class="owned">Owned</span> / <span class="available">Available</span> / <span class="pending">Pending</span></p></aside><section><div id="map"></div><p class="mapnote">Seeded properties are listed without exact map coordinates. Admin mode: click the map to add a custom marker.</p></section></main>
<dialog id="adminDialog"><form method="dialog"><h2>Admin unlock</h2><p>Local browser-only lock (not secure authentication).</p><input id="password" type="password" placeholder="Password"><button id="unlock" value="ok">Unlock</button></form></dialog>
<dialog id="propertyDialog"><form id="form"><h2>Property details</h2><input id="id" type="hidden"><label>Name / address<input id="name" required></label><label>Type<select id="type"><option>House</option><option>Apartment</option><option>Business</option><option>Story</option></select></label><label>Status<select id="statusSelect"><option value="available">Available</option><option value="owned">Owned</option><option value="pending">Pending</option></select></label><label>Owner<input id="owner"></label><label>Price<input id="price"></label><label>Notes<textarea id="notes"></textarea></label><div class="buttons"><button type="button" id="delete">Delete</button><button type="button" id="cancel">Cancel</button><button type="submit">Save</button></div></form></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
